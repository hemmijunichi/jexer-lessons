name: monthly

# www.jexer.jp は GitHub のサーバーからの接続を受け付けない（接続タイムアウト）ため、
# 毎月の自動実行は手元の Windows PC のタスクスケジューラ（run_monthly.ps1）で行う。
# サイト側が接続を受け付けるようになったときのために手動実行だけ残している。
# 戻すときは下に schedule: - cron: "0 0 1 * *" を追加する。
on:
  workflow_dispatch:       # Actions 画面から手動実行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape this month
        run: python scrape.py

      - name: Scrape next month
        run: python scrape.py --next

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 更新"
            git push
          fi
